name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: threadkeeper-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # Matches the toolchain pinned in build.gradle.kts. Without a matching
          # local JDK, Gradle fails outright rather than falling back.
          java-version: '17'
          distribution: temurin

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --no-daemon

      # The tests build the schema from JPA entities, but FlywayMigrationTest
      # (included above) builds it from db/migration and validates the entities
      # against that, so a migration that drifts from an entity fails here.

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: threadkeeper-api/build/reports/tests/test
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: threadkeeper-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: threadkeeper-web/package-lock.json

      # npm ci also fails if package-lock.json has drifted from package.json.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The shell scripts are what the LaunchAgents actually run at boot, so a
      # break here is only noticed when the machine next restarts.
      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Test log rotation
        run: ./scripts/rotate-logs.test.sh

  bridge:
    name: Bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-state-migrator-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies and no lockfile: the bridge runs on node:test alone.
      - name: Test
        run: npm test
