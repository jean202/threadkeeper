spring:
  datasource:
    generate-unique-name: true
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      jdbc-url: jdbc:h2:mem:threadkeeper-${random.uuid};MODE=PostgreSQL;DATABASE_TO_UPPER=false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false

threadkeeper:
  notifications:
    discord:
      webhook-url: ""
