spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/threadkeeper
    username: threadkeeper
    password: threadkeeper
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

threadkeeper:
  notifications:
    scheduler:
      enabled: true
      evaluation-delay-ms: ${THREADKEEPER_NOTIFICATION_EVALUATION_DELAY_MS:60000}
      dispatch-delay-ms: ${THREADKEEPER_NOTIFICATION_DISPATCH_DELAY_MS:30000}
    discord:
      webhook-url: ${THREADKEEPER_DISCORD_WEBHOOK_URL:}
  drift:
    enabled: ${THREADKEEPER_DRIFT_ENABLED:true}
    threshold: ${THREADKEEPER_DRIFT_THRESHOLD:60}
    recent-snapshots: ${THREADKEEPER_DRIFT_RECENT_SNAPSHOTS:3}
    recent-sessions: ${THREADKEEPER_DRIFT_RECENT_SESSIONS:5}
  portfolio:
    enabled: ${THREADKEEPER_PORTFOLIO_ENABLED:false}
    json-path: ${THREADKEEPER_PORTFOLIO_JSON_PATH:}
    stale-max-days: ${THREADKEEPER_PORTFOLIO_STALE_MAX_DAYS:14}
  import-scheduler:
    enabled: ${THREADKEEPER_IMPORT_ENABLED:false}
    connection-id: ${THREADKEEPER_IMPORT_CONNECTION_ID:1}
    target: ${THREADKEEPER_IMPORT_TARGET:codex,claude}
    migrator-path: ${THREADKEEPER_IMPORT_MIGRATOR_PATH:}
    bridge-path: ${THREADKEEPER_IMPORT_BRIDGE_PATH:}
    profile: ${THREADKEEPER_IMPORT_PROFILE:full}
    include-sensitive: ${THREADKEEPER_IMPORT_INCLUDE_SENSITIVE:false}
    check-delay-ms: ${THREADKEEPER_IMPORT_CHECK_DELAY_MS:3600000}
    staleness-threshold-hours: ${THREADKEEPER_IMPORT_STALENESS_HOURS:20}
