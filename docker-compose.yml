services:
  postgres:
    image: postgres:16-alpine
    container_name: threadkeeper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: threadkeeper
      POSTGRES_PASSWORD: threadkeeper
      POSTGRES_DB: threadkeeper
    ports:
      # Loopback only. "5432:5432" would publish the database on every
      # interface, and it uses the default development credentials.
      - "127.0.0.1:5432:5432"
    volumes:
      - threadkeeper-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadkeeper -d threadkeeper"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  threadkeeper-postgres-data:
